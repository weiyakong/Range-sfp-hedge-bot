name = "btc-derivatives-collector"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "btc-derivatives"
database_id = "DEPLOY_TIME_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"

[secrets]
required = ["COINALYZE_API_KEY"]
